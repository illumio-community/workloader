name: Workloader Release
on:
  push:
    branches:
      - master
    paths:
      - version
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
        id: go

      - name: Get dependencies
        run: |
          go mod download
          sudo apt update
          sudo apt install -y mingw-w64

      - name: Generate version.rc File
        run: |
          VERSION=$(cat version)
          # Windows numeric version fields need four comma-separated integers (e.g. 12,2,0,0)
          IFS=. read -r V_MAJOR V_MINOR V_PATCH <<< "${VERSION%%[-+]*}"
          WIN_VERSION="${V_MAJOR:-0},${V_MINOR:-0},${V_PATCH:-0},0"
          cat <<EOF > version.rc
          #include <winver.h>

          VS_VERSION_INFO VERSIONINFO
          FILEVERSION $WIN_VERSION
          PRODUCTVERSION $WIN_VERSION
          FILEFLAGSMASK 0x3fL
          FILEFLAGS 0x0L
          FILEOS VOS_NT_WINDOWS32
          FILETYPE VFT_APP
          FILESUBTYPE VFT2_UNKNOWN
          BEGIN
              BLOCK "StringFileInfo"
              BEGIN
                  BLOCK "040904b0"
                  BEGIN
                      VALUE "FileDescription", "Workloader is an open-source CLI tool that leverages the Illumio API to manage resources and automate common tasks."
                      VALUE "InternalName", "workloader"
                      VALUE "OriginalFilename", "workloader.exe"
                      VALUE "ProductName", "Workloader"
                      VALUE "FileVersion", "$VERSION"
                      VALUE "ProductVersion", "$VERSION"
                  END
              END
              BLOCK "VarFileInfo"
              BEGIN
                  VALUE "Translation", 0x0409, 1200
              END
          END
          EOF
          echo "Generated version.rc with version $VERSION ($WIN_VERSION)"

      # The _windows_amd64 suffix limits this resource object to the Windows amd64 build
      - name: Compile version.rc into version_windows_amd64.syso
        run: |
          x86_64-w64-mingw32-windres version.rc -O coff -o version_windows_amd64.syso

      - name: Get workloader version
        id: get_version
        run: |
          echo "version=$(cat version)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-list -1 HEAD)" >> $GITHUB_OUTPUT

      - name: Make output directories
        run: |
          mkdir windows-v${{ steps.get_version.outputs.version }} mac-v${{ steps.get_version.outputs.version }} linux_amd64-v${{ steps.get_version.outputs.version }} linux_arm-v${{ steps.get_version.outputs.version }}

      - name: Build Windows executable
        run: GOOS=windows go build -ldflags "-X github.com/brian1917/workloader/utils.Version=${{ steps.get_version.outputs.version }} -X github.com/brian1917/workloader/utils.Commit=${{ steps.get_version.outputs.commit }}" -o ./windows-v${{ steps.get_version.outputs.version }}/workloader.exe

      - name: Build Mac executable
        run: GOOS=darwin go build -ldflags "-X github.com/brian1917/workloader/utils.Version=${{ steps.get_version.outputs.version }} -X github.com/brian1917/workloader/utils.Commit=${{ steps.get_version.outputs.commit }}" -o ./mac-v${{ steps.get_version.outputs.version }}/workloader

      - name: Build Linux amd64 executable
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X github.com/brian1917/workloader/utils.Version=${{ steps.get_version.outputs.version }} -X github.com/brian1917/workloader/utils.Commit=${{ steps.get_version.outputs.commit }}" -o ./linux_amd64-v${{ steps.get_version.outputs.version }}/workloader

      - name: Build Linux ARM executable
        run: GOOS=linux GOARCH=arm CGO_ENABLED=0 go build -ldflags "-X github.com/brian1917/workloader/utils.Version=${{ steps.get_version.outputs.version }} -X github.com/brian1917/workloader/utils.Commit=${{ steps.get_version.outputs.commit }}" -o ./linux_arm-v${{ steps.get_version.outputs.version }}/workloader

      - name: Generate SHA256 checksums
        run: |
          echo "windows: $(sha256sum ./windows-v${{ steps.get_version.outputs.version }}/workloader.exe)" > checksums.txt
          echo "mac: $(sha256sum ./mac-v${{ steps.get_version.outputs.version }}/workloader)" >> checksums.txt
          echo "linux amd64: $(sha256sum ./linux_amd64-v${{ steps.get_version.outputs.version }}/workloader)" >> checksums.txt
          echo "linux arm: $(sha256sum ./linux_arm-v${{ steps.get_version.outputs.version }}/workloader)" >> checksums.txt

      - name: Create release zip packages
        run: |
          zip -r windows-v${{ steps.get_version.outputs.version }}.zip windows-v${{ steps.get_version.outputs.version }}/
          zip -r mac-v${{ steps.get_version.outputs.version }}.zip mac-v${{ steps.get_version.outputs.version }}/
          zip -r linux_amd64-v${{ steps.get_version.outputs.version }}.zip linux_amd64-v${{ steps.get_version.outputs.version }}/
          zip -r linux_arm-v${{ steps.get_version.outputs.version }}.zip linux_arm-v${{ steps.get_version.outputs.version }}/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body_path: ./checksums.txt
          files: |
            windows-v${{ steps.get_version.outputs.version }}.zip
            mac-v${{ steps.get_version.outputs.version }}.zip
            linux_amd64-v${{ steps.get_version.outputs.version }}.zip
            linux_arm-v${{ steps.get_version.outputs.version }}.zip
            checksums.txt
