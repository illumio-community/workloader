name: Workloader Release
on:
  push:
    branches:
      - master
    paths:
      - version
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
        id: go

      # The restored Go build cache keeps its original file times. Go deletes cache entries
      # unused for 5+ days after the first build, so without this only the first target
      # would get cache hits when releases are more than 5 days apart.
      - name: Keep restored Go build cache from being trimmed
        run: |
          GOCACHE_DIR="$(go env GOCACHE)"
          # The directory does not exist on a cache miss
          if [ -d "$GOCACHE_DIR" ]; then
            find "$GOCACHE_DIR" -type f -exec touch {} +
          fi

      - name: Get dependencies
        run: go mod download

      # Builds the Windows version resource with go-winres (pure Go, no mingw/apt needed).
      # The _windows_amd64 suffix limits this resource object to the Windows amd64 build.
      - name: Generate version_windows_amd64.syso
        run: |
          VERSION=$(cat version)
          # Windows numeric version fields need four integers (e.g. 12.2.0.0)
          IFS=. read -r V_MAJOR V_MINOR V_PATCH <<< "${VERSION%%[-+]*}"
          WIN_VERSION="${V_MAJOR:-0}.${V_MINOR:-0}.${V_PATCH:-0}.0"
          cat <<EOF > winres.json
          {
            "RT_VERSION": {
              "#1": {
                "0000": {
                  "fixed": {
                    "file_version": "$WIN_VERSION",
                    "product_version": "$WIN_VERSION"
                  },
                  "info": {
                    "0409": {
                      "FileDescription": "Workloader is an open-source CLI tool that leverages the Illumio API to manage resources and automate common tasks.",
                      "InternalName": "workloader",
                      "OriginalFilename": "workloader.exe",
                      "ProductName": "Workloader",
                      "FileVersion": "$VERSION",
                      "ProductVersion": "$VERSION"
                    }
                  }
                }
              }
            }
          }
          EOF
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json --arch amd64 --out version
          echo "Generated version_windows_amd64.syso with version $VERSION ($WIN_VERSION)"

      - name: Get workloader version
        id: get_version
        run: |
          echo "version=$(cat version)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-list -1 HEAD)" >> $GITHUB_OUTPUT

      - name: Make output directories
        run: |
          mkdir windows-v${{ steps.get_version.outputs.version }} mac_amd64-v${{ steps.get_version.outputs.version }} mac_arm64-v${{ steps.get_version.outputs.version }} linux_amd64-v${{ steps.get_version.outputs.version }} linux_arm-v${{ steps.get_version.outputs.version }}

      - name: Build Windows executable
        run: GOOS=windows go build -ldflags "-X github.com/brian1917/workloader/utils.Version=${{ steps.get_version.outputs.version }} -X github.com/brian1917/workloader/utils.Commit=${{ steps.get_version.outputs.commit }}" -o ./windows-v${{ steps.get_version.outputs.version }}/workloader.exe

      - name: Build Mac Intel (amd64) executable
        run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X github.com/brian1917/workloader/utils.Version=${{ steps.get_version.outputs.version }} -X github.com/brian1917/workloader/utils.Commit=${{ steps.get_version.outputs.commit }}" -o ./mac_amd64-v${{ steps.get_version.outputs.version }}/workloader

      - name: Build Mac Apple Silicon (arm64) executable
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-X github.com/brian1917/workloader/utils.Version=${{ steps.get_version.outputs.version }} -X github.com/brian1917/workloader/utils.Commit=${{ steps.get_version.outputs.commit }}" -o ./mac_arm64-v${{ steps.get_version.outputs.version }}/workloader

      - name: Build Linux amd64 executable
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X github.com/brian1917/workloader/utils.Version=${{ steps.get_version.outputs.version }} -X github.com/brian1917/workloader/utils.Commit=${{ steps.get_version.outputs.commit }}" -o ./linux_amd64-v${{ steps.get_version.outputs.version }}/workloader

      - name: Build Linux ARM executable
        run: GOOS=linux GOARCH=arm CGO_ENABLED=0 go build -ldflags "-X github.com/brian1917/workloader/utils.Version=${{ steps.get_version.outputs.version }} -X github.com/brian1917/workloader/utils.Commit=${{ steps.get_version.outputs.commit }}" -o ./linux_arm-v${{ steps.get_version.outputs.version }}/workloader

      - name: Generate SHA256 checksums
        run: |
          echo "windows: $(sha256sum ./windows-v${{ steps.get_version.outputs.version }}/workloader.exe)" > checksums.txt
          echo "mac amd64: $(sha256sum ./mac_amd64-v${{ steps.get_version.outputs.version }}/workloader)" >> checksums.txt
          echo "mac arm64: $(sha256sum ./mac_arm64-v${{ steps.get_version.outputs.version }}/workloader)" >> checksums.txt
          echo "linux amd64: $(sha256sum ./linux_amd64-v${{ steps.get_version.outputs.version }}/workloader)" >> checksums.txt
          echo "linux arm: $(sha256sum ./linux_arm-v${{ steps.get_version.outputs.version }}/workloader)" >> checksums.txt

      - name: Create release zip packages
        run: |
          zip -r windows-v${{ steps.get_version.outputs.version }}.zip windows-v${{ steps.get_version.outputs.version }}/
          zip -r mac_amd64-v${{ steps.get_version.outputs.version }}.zip mac_amd64-v${{ steps.get_version.outputs.version }}/
          zip -r mac_arm64-v${{ steps.get_version.outputs.version }}.zip mac_arm64-v${{ steps.get_version.outputs.version }}/
          zip -r linux_amd64-v${{ steps.get_version.outputs.version }}.zip linux_amd64-v${{ steps.get_version.outputs.version }}/
          zip -r linux_arm-v${{ steps.get_version.outputs.version }}.zip linux_arm-v${{ steps.get_version.outputs.version }}/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body_path: ./checksums.txt
          files: |
            windows-v${{ steps.get_version.outputs.version }}.zip
            mac_amd64-v${{ steps.get_version.outputs.version }}.zip
            mac_arm64-v${{ steps.get_version.outputs.version }}.zip
            linux_amd64-v${{ steps.get_version.outputs.version }}.zip
            linux_arm-v${{ steps.get_version.outputs.version }}.zip
            checksums.txt
